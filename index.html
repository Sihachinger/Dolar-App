<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dólar Argentina</title>
    <link rel="stylesheet" href="./styles.css">


</head>
<body>

    <div class="container">
        
        <!-- DÓLAR OFICIAL -->
        <div class="dolar-card" id="card-oficial">
            <h2>Oficial</h2>
            <div class="valores">
                <div>
                    <div class="label">Compra</div>
                    <div class="precio" id="oficial-compra">
                        <span class="loading-text">...</span>
                    </div>
                </div>
                <div>
                    <div class="label">Venta</div>
                    <div class="precio" id="oficial-venta">
                        <span class="loading-text">...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- DÓLAR BLUE -->
        <div class="dolar-card" id="card-blue">
            <h2>Blue</h2>
            <div class="valores">
                <div>
                    <div class="label">Compra</div>
                    <div class="precio" id="blue-compra">
                        <span class="loading-text">...</span>
                    </div>
                </div>
                <div>
                    <div class="label">Venta</div>
                    <div class="precio" id="blue-venta">
                        <span class="loading-text">...</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

<script src="./script.js"></script>

</html>
